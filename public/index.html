<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Healthcare DApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3>Healthcare Records</h3>
            </div>
            <div class="card-body">
                <div id="wallet-section" class="mb-4">
                    <button id="connectWallet" class="btn btn-success">Connect Wallet</button>
                    <span id="walletStatus" class="ms-3">Not connected</span>
                </div>
                
                <div class="mb-4">
                    <h4>Add Medical Record</h4>
                    <div class="mb-3">
                        <label class="form-label">Patient ID</label>
                        <input type="number" id="patientId" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Medical Data</label>
                        <textarea id="medicalData" class="form-control" rows="3"></textarea>
                    </div>
                    <button id="addRecord" class="btn btn-primary">Add Record (Pay 0.01 ETH)</button>
                </div>
                
                <div class="mb-4">
                    <h4>View Records</h4>
                    <div class="mb-3">
                        <label class="form-label">Patient ID</label>
                        <input type="number" id="viewId" class="form-control">
                    </div>
                    <button id="viewRecord" class="btn btn-info">View Record</button>
                    <div id="recordDisplay" class="mt-3 p-3 bg-light rounded"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js" type="module"></script>
</body>
</html>
